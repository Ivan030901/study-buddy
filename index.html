<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Buddy - 協作讀書網站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffc0cb 0%, #ffb6d9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .login-container h1 {
            color: #ff69b4;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .login-container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .user-select {
            margin-bottom: 20px;
        }

        .user-select label {
            display: block;
            color: #ff69b4;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .user-select input, .user-select select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffb6d9;
            border-radius: 10px;
            font-size: 1em;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .user-select input:focus, .user-select select:focus {
            outline: none;
            border-color: #ff69b4;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.4);
        }

        .btn-register {
            background: #ffe4f5;
            color: #ff69b4;
            border: 2px solid #ff69b4;
        }

        .btn-register:hover {
            background: #ffb6d9;
            transform: translateY(-2px);
        }

        .existing-users {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #ffe4f5;
        }

        .existing-users h3 {
            color: #ff69b4;
            margin-bottom: 15px;
        }

        .user-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .user-btn {
            padding: 10px;
            background: #ffe4f5;
            border: 2px solid #ffb6d9;
            border-radius: 8px;
            color: #ff69b4;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-btn:hover {
            background: #ffb6d9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>📚 Study Buddy</h1>
        <p>和朋友一起學習，互相激勵</p>

        <div id="loginForm">
            <div class="user-select">
                <label for="userName">姓名</label>
                <input type="text" id="userName" placeholder="輸入你的名字">
            </div>

            <div class="user-select">
                <label for="userRole">身份</label>
                <select id="userRole">
                    <option value="">選擇身份</option>
                    <option value="student">學生</option>
                    <option value="teacher">老師</option>
                    <option value="self-study">自學者</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn btn-login" onclick="loginUser()">進入</button>
                <button class="btn btn-register" onclick="showRegister()">新增用戶</button>
            </div>
        </div>

        <div class="existing-users" id="existingUsers" style="display: none;">
            <h3>選擇用戶</h3>
            <div class="user-buttons" id="usersList"></div>
            <button class="btn btn-register" onclick="backToLogin()" style="width: 100%; margin-top: 15px;">返回登入</button>
        </div>
    </div>

    <script>
        const users = JSON.parse(localStorage.getItem('studyBuddyUsers')) || [];

        function loginUser() {
            const name = document.getElementById('userName').value.trim();
            const role = document.getElementById('userRole').value;

            if (!name || !role) {
                alert('請填寫所有欄位');
                return;
            }

            const user = users.find(u => u.name === name);
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'dashboard.html';
            } else {
                const newUser = { id: Date.now(), name, role };
                users.push(newUser);
                localStorage.setItem('studyBuddyUsers', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(newUser));
                window.location.href = 'dashboard.html';
            }
        }

        function showRegister() {
            document.getElementById('existingUsers').style.display = 'block';
            loadUsers();
        }

        function backToLogin() {
            document.getElementById('existingUsers').style.display = 'none';
            document.getElementById('userName').value = '';
            document.getElementById('userRole').value = '';
        }

        function loadUsers() {
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = '';

            users.forEach(user => {
                const btn = document.createElement('button');
                btn.className = 'user-btn';
                btn.textContent = `${user.name}`;
                btn.onclick = () => {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    window.location.href = 'dashboard.html';
                };
                usersList.appendChild(btn);
            });
        }

        // 頁面載入時檢查是否有已登入用戶
        window.addEventListener('load', () => {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
